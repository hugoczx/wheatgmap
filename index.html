<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WheatGmap</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            font-family: 'Inter', 'Playfair Display', -apple-system, BlinkMacSystemFont, sans-serif;
            overflow: hidden;
        }

        .hero {
            position: relative;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: #fff;
        }

        .hero-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            overflow: hidden;
        }

        .hero-bg img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            animation: subtleZoom 20s ease-in-out infinite alternate;
        }

        .hero::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                135deg,
                rgba(20, 40, 20, 0.55) 0%,
                rgba(40, 70, 30, 0.45) 50%,
                rgba(15, 35, 15, 0.6) 100%
            );
            z-index: -1;
        }

        @keyframes subtleZoom {
            0% { transform: scale(1); }
            100% { transform: scale(1.05); }
        }

        .grain-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.04;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 0;
        }

        .content {
            position: relative;
            z-index: 1;
            max-width: 900px;
            padding: 0 2rem;
            animation: fadeInUp 1.2s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .tag {
            display: inline-block;
            padding: 0.5rem 1.2rem;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 100px;
            font-size: 0.8rem;
            font-weight: 500;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            margin-bottom: 2rem;
            backdrop-filter: blur(10px);
            background: rgba(255, 255, 255, 0.08);
            animation: fadeInUp 1.2s ease-out 0.2s both;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(3rem, 8vw, 6rem);
            font-weight: 700;
            letter-spacing: -0.02em;
            line-height: 1.1;
            margin-bottom: 1.5rem;
            text-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
            animation: fadeInUp 1.2s ease-out 0.4s both;
        }

        h1 span {
            display: inline-block;
            background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            font-size: clamp(1rem, 2.5vw, 1.35rem);
            font-weight: 300;
            line-height: 1.7;
            max-width: 600px;
            margin: 0 auto 3rem;
            color: rgba(255, 255, 255, 0.85);
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
            animation: fadeInUp 1.2s ease-out 0.6s both;
        }

        .cta-group {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
            animation: fadeInUp 1.2s ease-out 0.8s both;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.9rem 2.2rem;
            border-radius: 100px;
            font-size: 0.95rem;
            font-weight: 500;
            text-decoration: none;
            transition: all 0.3s ease;
            cursor: pointer;
            border: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, #4caf50 0%, #2e7d32 100%);
            color: #fff;
            box-shadow: 0 8px 30px rgba(76, 175, 80, 0.35);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 40px rgba(76, 175, 80, 0.45);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(10px);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        .migration-notice {
            display: inline-block;
            padding: 0.6rem 1.5rem;
            margin-bottom: 2rem;
            border-radius: 8px;
            background: rgba(255, 193, 7, 0.15);
            border: 1px solid rgba(255, 193, 7, 0.4);
            color: #ffe082;
            font-size: 0.95rem;
            font-weight: 500;
            backdrop-filter: blur(10px);
            animation: fadeInUp 1.2s ease-out 0.7s both;
        }

        .migration-notice a {
            color: #fff176;
            text-decoration: underline;
            font-weight: 600;
        }

        .migration-notice a:hover {
            color: #fff;
        }

        .scroll-indicator {
            position: absolute;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.75rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            animation: fadeInUp 1.2s ease-out 1.2s both, bounce 2s infinite;
            z-index: 1;
        }

        .scroll-indicator svg {
            width: 24px;
            height: 24px;
        }

        @keyframes bounce {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(8px); }
        }

        .nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 1.2rem 2.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            backdrop-filter: blur(12px);
            background: rgba(0, 0, 0, 0.15);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            animation: fadeInDown 1s ease-out;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-dialog {
            background: linear-gradient(135deg, rgba(30, 50, 30, 0.95) 0%, rgba(20, 40, 20, 0.98) 100%);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 2.5rem 3rem;
            max-width: 420px;
            width: 90%;
            text-align: center;
            color: #fff;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.5);
            transform: scale(0.9) translateY(20px);
            transition: transform 0.3s ease;
            position: relative;
        }

        .modal-overlay.active .modal-dialog {
            transform: scale(1) translateY(0);
        }

        .modal-dialog .modal-icon {
            width: 56px;
            height: 56px;
            margin: 0 auto 1.5rem;
            background: linear-gradient(135deg, #4caf50 0%, #2e7d32 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-dialog .modal-icon svg {
            width: 28px;
            height: 28px;
            stroke: #fff;
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .modal-dialog h3 {
            font-family: 'Playfair Display', serif;
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 0.3rem;
        }

        .modal-dialog .modal-role {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 1.5rem;
        }

        .modal-dialog .contact-info {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            padding: 0.9rem 1.2rem;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            font-size: 0.95rem;
            color: rgba(255, 255, 255, 0.9);
            word-break: break-all;
        }

        .modal-dialog .contact-info svg {
            width: 18px;
            height: 18px;
            stroke: #81c784;
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
            flex-shrink: 0;
        }

        .modal-dialog .modal-close {
            position: absolute;
            top: 1rem;
            right: 1rem;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.08);
            color: rgba(255, 255, 255, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 1.1rem;
            line-height: 1;
        }

        .modal-dialog .modal-close:hover {
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
        }

        .nav-logo {
            font-family: 'Playfair Display', serif;
            font-size: 1.4rem;
            font-weight: 700;
            color: #fff;
            text-decoration: none;
            letter-spacing: -0.01em;
        }

        .nav-links {
            display: flex;
            gap: 2.5rem;
            list-style: none;
        }

        .nav-links a {
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 400;
            transition: color 0.3s ease;
            position: relative;
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 0;
            height: 1.5px;
            background: #4caf50;
            transition: width 0.3s ease;
        }

        .nav-links a:hover {
            color: #fff;
        }

        .nav-links a:hover::after {
            width: 100%;
        }

        .features-strip {
            position: absolute;
            bottom: 5rem;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 4rem;
            padding: 0 2rem;
            z-index: 1;
            animation: fadeInUp 1.2s ease-out 1s both;
        }

        .feature-item {
            text-align: center;
            color: rgba(255, 255, 255, 0.7);
        }

        .feature-item .number {
            font-size: 2rem;
            font-weight: 700;
            color: #fff;
            display: block;
            line-height: 1;
            margin-bottom: 0.3rem;
        }

        .feature-item .label {
            font-size: 0.8rem;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        @media (max-width: 768px) {
            .nav-links {
                display: none;
            }
            .features-strip {
                gap: 2rem;
            }
            .feature-item .number {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <nav class="nav">
        <a href="#" class="nav-logo">WheatGmap</a>
        <ul class="nav-links">
            <li><a href="#" id="contact-link">Contact</a></li>
        </ul>
    </nav>

    <section class="hero">
        <picture class="hero-bg">
            <source srcset="bg.webp" type="image/webp">
            <img src="bg.jpg" alt="" loading="eager" fetchpriority="high">
        </picture>
        <div class="grain-overlay"></div>
        <div class="content">
            <h1><span>WheatGmap</span></h1>
            <p class="subtitle">
                A Comprehensive Genomic Platform for Wheat Gene Mapping and Data Analysis.
            </p>
            <div class="cta-group">
                <a href="https://wheatgmap.tcuni.com" class="btn btn-primary">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
                    WheatGmap has completed over 10,000 BSA tasks, and the new AI-powered version has been migrated to wheatgmap.tcuni.com
                </a>
            </div>
        </div>
    </section>

    <div class="modal-overlay" id="contact-modal">
        <div class="modal-dialog">
            <button class="modal-close" id="modal-close" aria-label="Close">&times;</button>
            <div class="modal-icon">
                <svg viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
            </div>
            <h3>Dr. Zhongxu Chen</h3>
            <div class="contact-info">
                <svg viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
                <span>czx@tcuni.com</span>
            </div>
        </div>
    </div>

    <script>
        (function() {
            const contactLink = document.getElementById('contact-link');
            const modal = document.getElementById('contact-modal');
            const closeBtn = document.getElementById('modal-close');

            function openModal(e) {
                e.preventDefault();
                modal.classList.add('active');
            }

            function closeModal() {
                modal.classList.remove('active');
            }

            contactLink.addEventListener('click', openModal);
            closeBtn.addEventListener('click', closeModal);

            modal.addEventListener('click', function(e) {
                if (e.target === modal) {
                    closeModal();
                }
            });

            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape' && modal.classList.contains('active')) {
                    closeModal();
                }
            });
        })();
    </script>
</body>
</html>
